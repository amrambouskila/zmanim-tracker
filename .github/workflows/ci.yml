name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .

  sast:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1

      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql

      # `--error` is deliberately absent: without it semgrep exits nonzero only when it fails to
      # RUN, so a crash or registry outage fails this step loudly instead of being reported as a
      # security finding. Findings are gated below, off the SARIF that was actually produced.
      - name: Semgrep
        run: >
          uvx semgrep scan
          --config auto --config p/owasp-top-ten --config p/python --config p/docker
          --severity ERROR --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: |
          findings=$(jq '[.runs[]?.results[]?] | length' semgrep.sarif)
          echo "Semgrep ERROR-severity findings: ${findings}"
          test "${findings}" -eq 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Audits the resolved lockfile, exported to a requirements file, rather than an installed
      # environment: `uv run --with pip-audit` would have audited pip-audit's own dependency tree
      # alongside the project's, and would silently re-lock instead of failing on a stale lock.
      # `--locked` makes lock drift a pipeline failure; `--strict` makes an unauditable package one.
      - name: Dependency audit
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt

  test:
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov-report=xml:coverage.xml --junitxml=junit-test.xml
      - name: Publish test report
        uses: dorny/test-reporter@v3
        # Forked-PR runs get a read-only token, so the reporter cannot create its check run there.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: test tests
          path: junit-test.xml
          reporter: java-junit

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: zmanim-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zmanim-tracker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # Explicit: without the ignore file the two pip-vendored findings documented in it are
          # HIGH and this job exits 1.
          trivyignores: .trivyignore
